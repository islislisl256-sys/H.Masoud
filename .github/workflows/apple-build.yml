name: Build Apple App (.app)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies and Build Web
        run: |
          npm install
          npm run build

      - name: Build Mac Desktop App (.app)
        working-directory: ./desktop-app
        run: |
          npm install
          npm run build -- --mac

      - name: Upload .app / .dmg Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Hanoutak-Apple-App
          path: desktop-app/dist/*.dmg