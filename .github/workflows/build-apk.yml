name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Create dummy .env.local (for cap sync only)
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co" > .env.local
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=placeholder" >> .env.local

      - name: Sync Capacitor (server URL mode - no build needed)
        run: npx cap sync android

      - name: Make gradlew executable
        working-directory: ./android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload APK as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hanoutak-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Copy APK to public folder and push
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk public/hanutak.apk
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add public/hanutak.apk
          git diff --staged --quiet || git commit -m "chore: auto-build Android APK -> https://h-masoud.vercel.app [skip ci]"
          git push