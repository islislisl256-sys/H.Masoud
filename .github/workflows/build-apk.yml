name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'capacitor.config.ts'
      - 'android/**'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Sync Capacitor (no build needed - server mode)
        run: npx cap sync android

      - name: Make gradlew executable
        working-directory: ./android
        run: chmod +x gradlew

      - name: Build APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v3
        with:
          name: hanutak-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Copy APK to public folder and commit
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk public/hanutak.apk
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add public/hanutak.apk
          git diff --staged --quiet || git commit -m "chore: auto-build Android APK pointing to https://h-masoud.vercel.app [skip ci]"
          git push